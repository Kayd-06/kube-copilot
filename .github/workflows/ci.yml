name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt ruff
      - name: Ruff
        run: ruff check backend ml
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q --tb=short

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Lint and template
        run: |
          helm lint deploy/helm/kube-copilot
          helm template kube-copilot deploy/helm/kube-copilot \
            -f deploy/helm/kube-copilot/values-kind.yaml \
            --namespace kube-copilot >/dev/null
          # Safe actions on: per-namespace write Roles must render.
          helm template kube-copilot deploy/helm/kube-copilot \
            --set actions.enabled=true --set 'actions.namespaces={copilot-demo}' \
            --namespace kube-copilot | grep 'name: kube-copilot-actions' >/dev/null
          # ...and must refuse kube-system.
          if helm template kube-copilot deploy/helm/kube-copilot \
            --set actions.enabled=true --set 'actions.namespaces={kube-system}' >/dev/null 2>&1; then
            echo "chart allowed actions in kube-system" >&2
            exit 1
          fi

  dockerfiles:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint backend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: backend/Dockerfile
          failure-threshold: warning
      - name: Lint frontend Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: frontend/Dockerfile
          failure-threshold: warning

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate

  e2e:
    name: kind smoke test
    needs: [backend, frontend, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Build images
        run: |
          docker build -t kube-copilot-backend:ci -f backend/Dockerfile .
          docker build -t kube-copilot-frontend:ci \
            --build-arg NEXT_PUBLIC_API_URL=/api \
            -f frontend/Dockerfile frontend
      - name: Create kind cluster
        uses: helm/kind-action@v1.12.0
        with:
          cluster_name: kube-copilot
          wait: 90s
      - name: Load images into kind
        run: |
          kind load docker-image kube-copilot-backend:ci --name kube-copilot
          kind load docker-image kube-copilot-frontend:ci --name kube-copilot
      - name: Install chart
        run: |
          helm upgrade --install kube-copilot deploy/helm/kube-copilot \
            --namespace kube-copilot --create-namespace \
            -f deploy/helm/kube-copilot/values-kind.yaml \
            --set backend.image.repository=kube-copilot-backend \
            --set backend.image.tag=ci \
            --set backend.image.pullPolicy=Never \
            --set frontend.image.repository=kube-copilot-frontend \
            --set frontend.image.tag=ci \
            --set frontend.image.pullPolicy=Never \
            --wait --timeout 5m
      - name: Smoke test /health
        run: |
          set -euo pipefail
          kubectl -n kube-copilot rollout status deploy/kube-copilot-backend --timeout=180s
          kubectl -n kube-copilot port-forward svc/kube-copilot-backend 18000:8000 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          trap 'kill ${PF_PID} 2>/dev/null || true' EXIT
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health > /tmp/health.json; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            echo "timed out waiting for /health; port-forward log:" >&2
            cat /tmp/pf.log >&2 || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          body = json.load(open("/tmp/health.json"))
          assert body.get("status") == "ok", body
          assert body.get("service") == "kube-copilot", body
          print("health ok:", body)
          PY
          curl -fsS http://127.0.0.1:18000/metrics | head -n 20
      - name: Scan images with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: kube-copilot-backend:ci
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          kubectl -n kube-copilot get pods -o wide || true
          kubectl -n kube-copilot describe pods || true
          kubectl -n kube-copilot logs -l app.kubernetes.io/component=backend --tail=80 || true
          kubectl -n kube-copilot logs -l app.kubernetes.io/component=frontend --tail=80 || true
