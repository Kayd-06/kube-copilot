name: LLM eval

# Manual only: replays the frozen incidents against a real model. Needs a
# repository secret named GROQ_API_KEY (Settings -> Secrets -> Actions).
# The offline fixture/scorer tests run in the normal CI workflow.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Groq model id"
        required: true
        default: "openai/gpt-oss-120b"
      variants:
        description: "Comma-separated: full,no_rag,no_signals"
        required: true
        default: "full"

permissions:
  contents: read

concurrency:
  group: llm-eval
  cancel-in-progress: false

jobs:
  eval:
    name: Eval ${{ inputs.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Check the secret is configured
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "${GROQ_API_KEY}" ]; then
            echo "::error::Add a GROQ_API_KEY repository secret to run the LLM eval." >&2
            exit 1
          fi
      - name: Run the eval
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL: ${{ inputs.model }}
          VARIANTS: ${{ inputs.variants }}
        run: |
          PYTHONPATH=.:backend python -m ml.llm_eval.run --model "$MODEL" --variants "$VARIANTS" \
            --out-dir eval-out
      - name: Summary
        if: always()
        run: cat eval-out/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: llm-eval-report
          path: eval-out/
