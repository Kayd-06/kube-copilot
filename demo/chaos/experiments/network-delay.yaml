# network_delay: 200ms +/- 50ms latency on all traffic of victim-net pods.
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay
  namespace: chaos-lab
  labels: {kube-copilot/scenario: network_delay}
spec:
  action: delay
  mode: all
  selector:
    namespaces: [chaos-lab]
    labelSelectors: {app: victim-net}
  delay:
    latency: "200ms"
    jitter: "50ms"
    correlation: "25"
  duration: "10m"
