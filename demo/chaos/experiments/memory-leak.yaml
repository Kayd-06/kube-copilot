# memory_leak: Chaos Mesh has no "grow slowly" memory stressor, so this
# scenario is a real leaking workload. `make chaos-run SCENARIO=memory_leak`
# (and ml/collect.py) scales it from 0 to 2 replicas for the chaos window and
# back to 0 afterwards. Each pod appends 1 MiB to /dev/shm every 3s (~20 MiB/min).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victim-leak
  namespace: chaos-lab
  labels: {kube-copilot/scenario: memory_leak}
spec:
  replicas: 0
  selector:
    matchLabels: {app: victim-leak}
  template:
    metadata:
      labels: {app: victim-leak, kube-copilot/chaos-target: "true"}
    spec:
      containers:
        - name: leak
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              : > /dev/shm/leak
              while true; do
                dd if=/dev/zero bs=1048576 count=1 >> /dev/shm/leak 2>/dev/null
                sleep 3
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 192Mi}
