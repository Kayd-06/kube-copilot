apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: observability
  labels:
    app: grafana
    app.kubernetes.io/part-of: kube-copilot
data:
  kube-copilot.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "id": 1,
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Flagged pods",
          "type": "stat",
          "targets": [
            { "expr": "sum(kube_copilot_anomaly_flagged)", "legendFormat": "flagged", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "decimals": 2, "unit": "s" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "id": 2,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "reduceOptions": { "calcs": ["mean"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "Diagnose latency (avg)",
          "type": "stat",
          "targets": [
            { "expr": "rate(kube_copilot_diagnose_latency_seconds_sum[5m]) / rate(kube_copilot_diagnose_latency_seconds_count[5m])", "legendFormat": "avg", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "id": 3,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "LLM calls / s",
          "type": "stat",
          "targets": [
            { "expr": "sum(rate(kube_copilot_llm_calls_total[5m]))", "legendFormat": "calls", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "ops" }, "overrides": [] },
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "id": 4,
          "options": { "colorMode": "value", "graphMode": "area", "justifyMode": "auto", "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false }, "textMode": "auto" },
          "title": "HTTP requests / s",
          "type": "stat",
          "targets": [
            { "expr": "sum(rate(http_request_duration_seconds_count[5m])) or sum(rate(http_requests_total[5m]))", "legendFormat": "http", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": true }, "unit": "short" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "id": 5,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Pod CPU (cores)",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (namespace, pod) (rate(container_cpu_usage_seconds_total{container!=\"\", container!=\"POD\", namespace=~\"$namespace\"}[1m]))", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": true }, "unit": "bytes" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "id": 6,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Pod memory (working set)",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (namespace, pod) (container_memory_working_set_bytes{container!=\"\", container!=\"POD\", namespace=~\"$namespace\"})", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1, "spanNulls": true }, "unit": "short" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "id": 7,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Container restarts",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (namespace, pod) (kube_pod_container_status_restarts_total{namespace=~\"$namespace\"})", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 2, "spanNulls": true }, "max": 1, "min": 0, "unit": "percentunit" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "id": 8,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Anomaly scores (0.5 = decision boundary)",
          "type": "timeseries",
          "targets": [
            { "expr": "kube_copilot_anomaly_score", "legendFormat": "{{namespace}}/{{pod}}", "refId": "A" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "s" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "id": 9,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "Diagnose latency",
          "type": "timeseries",
          "targets": [
            { "expr": "rate(kube_copilot_diagnose_latency_seconds_sum[5m]) / rate(kube_copilot_diagnose_latency_seconds_count[5m])", "legendFormat": "mean", "refId": "A" },
            { "expr": "histogram_quantile(0.95, rate(kube_copilot_diagnose_latency_seconds_bucket[5m]))", "legendFormat": "p95", "refId": "B" }
          ]
        },
        {
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": {
            "defaults": { "custom": { "drawStyle": "line", "fillOpacity": 10, "lineWidth": 1 }, "unit": "ops" },
            "overrides": []
          },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "id": 10,
          "options": { "legend": { "displayMode": "list", "placement": "bottom" }, "tooltip": { "mode": "multi" } },
          "title": "LLM calls by status",
          "type": "timeseries",
          "targets": [
            { "expr": "sum by (status) (rate(kube_copilot_llm_calls_total[5m]))", "legendFormat": "{{status}}", "refId": "A" }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["kube-copilot", "kubernetes"],
      "templating": {
        "list": [
          {
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(kube_pod_info, namespace)",
            "includeAll": true,
            "allValue": ".*",
            "label": "Namespace",
            "multi": false,
            "name": "namespace",
            "query": { "qryType": 1, "query": "label_values(kube_pod_info, namespace)", "refId": "PrometheusVariableQueryEditor-VariableQuery" },
            "refresh": 2,
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-30m", "to": "now" },
      "timepicker": {},
      "timezone": "browser",
      "title": "Kube Copilot",
      "uid": "kube-copilot",
      "version": 1
    }
