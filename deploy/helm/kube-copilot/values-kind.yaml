# Overrides for a single-node kind cluster on a low-spec laptop.
# Images are expected to be loaded with `make kind-load` (pullPolicy Never).

backend:
  image:
    pullPolicy: Never
    tag: dev
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 400m
      memory: 512Mi
  env:
    k8sInCluster: "true"
    prometheusUrl: http://prometheus.observability.svc.cluster.local:9090
    corsOrigins: "http://localhost:3000,http://127.0.0.1:3000"
    anomalyPollerEnabled: "false"

frontend:
  image:
    pullPolicy: Never
    tag: dev
  publicApiUrl: /api
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

qdrant:
  enabled: true
  persistence: false
  resources:
    requests:
      cpu: 25m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

ingress:
  enabled: false
