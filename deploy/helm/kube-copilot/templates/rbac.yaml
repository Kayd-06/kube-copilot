{{- if and .Values.rbac.create .Values.rbac.clusterRole.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kube-copilot.fullname" . }}
  labels:
    {{- include "kube-copilot.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events"]
    verbs: ["get", "list", "watch"]
  # Lifecycle detector: desired vs available replicas and ReplicaSet age.
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kube-copilot.fullname" . }}
  labels:
    {{- include "kube-copilot.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kube-copilot.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kube-copilot.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
