{{- if and (not .Values.llm.existingSecret) .Values.llm.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kube-copilot.llmSecretName" . }}
  labels:
    {{- include "kube-copilot.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.llm.existingSecretKey | default "LLM_API_KEY" }}: {{ .Values.llm.apiKey | b64enc | quote }}
{{- end }}
