apiVersion: v1
kind: Service
metadata:
  name: {{ include "kube-copilot.backend.fullname" . }}
  labels:
    {{- include "kube-copilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    app.kubernetes.io/name: kube-copilot
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: {{ .Values.backend.service.port | quote }}
    prometheus.io/path: /metrics
spec:
  type: {{ .Values.backend.service.type }}
  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "kube-copilot.backend.selectorLabels" . | nindent 4 }}
